include:
  - project: platform/factory
    ref: main
    file: /templates/gitlab-ci/buildkit-rootless.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH"

stages:
  - test
  - package

variables:
  CGO_ENABLED: "0"

test:
  stage: test
  image: golang:1.26.1-alpine
  script:
    - go test ./...
    - make static-site

container:build:
  extends: .factory:buildkit-rootless
  stage: package
  tags:
    - unraid-oci-build
  variables:
    FACTORY_BUILDKIT_TARGET: static
    FACTORY_BUILDKIT_IMAGE_NAMES: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        FACTORY_BUILDKIT_IMAGE_NAMES: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - when: never
